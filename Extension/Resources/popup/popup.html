<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undirect</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <h1 class="wordmark" data-i18n="app_title"></h1>
      <button type="button" class="link" id="view-toggle"></button>
      <label class="switch">
        <span class="switch-label" data-i18n="popup_guard_label"></span>
        <input type="checkbox" id="guard" />
        <span class="switch-state" id="guard-state"></span>
      </label>
    </header>

    <p class="warning" id="bridge-warning" hidden data-i18n="popup_bridge_warning"></p>

    <section class="panel page-view">
      <h2 data-i18n="popup_page_heading"></h2>
      <p class="lead" id="page-count"></p>
      <p class="note" id="page-recipe" hidden></p>
      <ul class="rows" id="rows"></ul>
      <button type="button" class="link" id="report" data-i18n="action_report"></button>
    </section>

    <section class="panel page-view">
      <h2 data-i18n="popup_settings_heading"></h2>
      <label class="switch row-switch">
        <span class="switch-label" data-i18n="setting_banner"></span>
        <input type="checkbox" id="banner" />
        <span class="switch-state" id="banner-state"></span>
      </label>
      <p class="sub-label" data-i18n="popup_policy_heading"></p>
      <div class="choice" role="radiogroup" id="policy">
        <label>
          <input type="radio" name="policy" value="block" />
          <span data-i18n="policy_block"></span>
        </label>
        <label>
          <input type="radio" name="policy" value="allow" />
          <span data-i18n="policy_allow"></span>
        </label>
      </div>
    </section>

    <section class="panel" id="rules-view" hidden>
      <h2 data-i18n="rules_everywhere_heading"></h2>
      <ul class="rows" id="rules-everywhere"></ul>
      <h2 class="spaced" data-i18n="rules_by_site_heading"></h2>
      <ul class="rows" id="rules-by-site"></ul>
    </section>

    <footer class="foot">
      <p id="session"></p>
      <p id="total"></p>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
