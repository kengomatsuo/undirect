<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Undirect</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- This tab: the site, its Stop button, what it reached for. -->
    <main class="view" id="page-view">
      <section class="hero" id="watch-group">
        <p class="hint" id="stop-hint" data-i18n="popup_stop_help"></p>
        <button type="button" class="power" id="stop" data-i18n-aria="popup_stop">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v8" />
            <path d="M6.3 6.8a8 8 0 1 0 11.4 0" />
          </svg>
        </button>
        <span class="title site" id="site"></span>
        <span class="subtitle" id="watch-note"></span>
      </section>

      <p class="warning" id="bridge-warning" hidden data-i18n="popup_bridge_warning"></p>

      <section id="page-section">
        <h2 class="header">
          <span data-i18n="popup_page_heading"></span>
          <span class="header-trailing" id="page-count"></span>
        </h2>
        <ul class="group" id="rows"></ul>
        <p class="note" id="page-quiet" hidden data-i18n="popup_page_quiet"></p>
        <p class="footer" id="page-recipe" hidden></p>
      </section>

      <ul class="group">
        <li class="row nav" data-go="rules-view">
          <span class="title" data-i18n="popup_rules_link"></span>
          <span class="chevron" aria-hidden="true"></span>
        </li>
        <li class="row nav" data-go="settings-view">
          <span class="title" data-i18n="popup_settings_heading"></span>
          <span class="chevron" aria-hidden="true"></span>
        </li>
        <li class="row nav" id="report">
          <span class="title" data-i18n="action_report"></span>
        </li>
      </ul>
    </main>

    <main class="view" id="rules-view" hidden>
      <header class="navbar">
        <button type="button" class="back" data-go="page-view" data-i18n-label="popup_page_link">
          <span class="back-chevron" aria-hidden="true"></span>
        </button>
        <h1 data-i18n="popup_rules_link"></h1>
      </header>
      <h2 class="header" data-i18n="rules_everywhere_heading"></h2>
      <ul class="group" id="rules-everywhere"></ul>
      <h2 class="header" data-i18n="rules_by_site_heading"></h2>
      <ul class="group" id="rules-by-site"></ul>
    </main>

    <main class="view" id="settings-view" hidden>
      <header class="navbar">
        <button type="button" class="back" data-go="page-view" data-i18n-label="popup_page_link">
          <span class="back-chevron" aria-hidden="true"></span>
        </button>
        <h1 data-i18n="popup_settings_heading"></h1>
      </header>
      <ul class="group">
        <li class="row">
          <span class="title" data-i18n="popup_guard_label"></span>
          <label class="switch">
            <input type="checkbox" id="guard" switch />
            <span class="sr-only" data-i18n="popup_guard_label"></span>
          </label>
        </li>
        <li class="row">
          <span class="title" data-i18n="setting_banner"></span>
          <label class="switch">
            <input type="checkbox" id="banner" switch />
            <span class="sr-only" data-i18n="setting_banner"></span>
          </label>
        </li>
      </ul>

      <h2 class="header" data-i18n="popup_mode_heading"></h2>
      <ul class="group" role="radiogroup">
        <li class="row choice">
          <label>
            <input type="radio" name="mode" value="watched" />
            <span class="title" data-i18n="mode_watched"></span>
            <span class="check" aria-hidden="true"></span>
          </label>
        </li>
        <li class="row choice">
          <label>
            <input type="radio" name="mode" value="everywhere" />
            <span class="title" data-i18n="mode_everywhere"></span>
            <span class="check" aria-hidden="true"></span>
          </label>
        </li>
      </ul>

      <h2 class="header" data-i18n="popup_policy_heading"></h2>
      <ul class="group" role="radiogroup">
        <li class="row choice">
          <label>
            <input type="radio" name="policy" value="block" />
            <span class="title" data-i18n="policy_block"></span>
            <span class="check" aria-hidden="true"></span>
          </label>
        </li>
        <li class="row choice">
          <label>
            <input type="radio" name="policy" value="allow" />
            <span class="title" data-i18n="policy_allow"></span>
            <span class="check" aria-hidden="true"></span>
          </label>
        </li>
      </ul>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
