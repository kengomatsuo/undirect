<!-- #31 Mac people: what's the first thing you delete when you set up a new Mac?

  img { width: 140px; height: 140px }
  figcaption { font: 500 21px/1.1 -apple-system, system-ui; color: #1d1d1f; letter-spacing: -.01em; white-space: nowrap }
</style>
