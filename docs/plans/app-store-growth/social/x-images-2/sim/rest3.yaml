# Settings > Apps > Cutling > Paste from Other Apps (#15). Settings reopens on the page it was left on, so the flow
# swipes back from the left edge to the top level before looking for Apps. Screenshots land in Maestro's output folder.
appId: com.apple.Preferences
---
- runFlow:
    label: "paste permission (#15)"
    optional: true
    commands:
      - pressKey: Home
      - launchApp:
          appId: com.apple.Preferences
      - takeScreenshot: rest3-0-open
      - repeat:
          times: 5
          commands:
            - swipe:
                start: "1%,45%"
                end: "90%,45%"
      - takeScreenshot: rest3-1-top
      - scrollUntilVisible:
          element:
            text: "Apps"
          direction: DOWN
          timeout: 20000
      - tapOn: "Apps"
      - scrollUntilVisible:
          element:
            text: "Cutling"
          direction: DOWN
          timeout: 20000
      - tapOn: "Cutling"
      - takeScreenshot: rest-9-cutling-settings
      - tapOn:
          text: "Paste from Other Apps"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: rest-10-paste-setting
