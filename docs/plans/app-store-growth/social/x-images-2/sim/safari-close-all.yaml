# Safari: hold the tabs button and close every tab.
appId: com.apple.mobilesafari
---
- launchApp:
    appId: com.apple.mobilesafari
- waitForAnimationToEnd
- longPressOn:
    point: "86%,94%"
- waitForAnimationToEnd
- tapOn:
    text: "Close All.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Close All.*"
    optional: true
- waitForAnimationToEnd
