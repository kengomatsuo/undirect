# A new empty note, then the Paste menu over the caret.
appId: com.apple.mobilenotes
---
- launchApp:
    appId: com.apple.mobilenotes
- waitForAnimationToEnd
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "New note"
    optional: true
- tapOn:
    text: "New Note"
    optional: true
- waitForAnimationToEnd
- tapOn:
    point: "50%,35%"
- waitForAnimationToEnd
- tapOn:
    point: "50%,35%"
- waitForAnimationToEnd
