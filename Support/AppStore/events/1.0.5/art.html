<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#E3192B}
  #flow,#arrows{position:absolute;inset:0;width:100%;height:100%;display:block}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0}
  .page{position:absolute;box-sizing:border-box;border-radius:46px;background:#121215;overflow:hidden;
    display:flex;flex-direction:column;padding:26px 26px 22px;
    box-shadow:0 0 0 1.5px rgb(255 255 255 / 7%) inset,0 46px 80px -12px rgb(84 0 16 / 62%),0 12px 26px rgb(84 0 16 / 38%)}
  .hero{flex:none;border-radius:24px;background:#2b2b33;overflow:hidden}
  .hero svg{display:block;width:100%;height:100%}
  .h{flex:none;height:24px;border-radius:12px;background:#f4f4f6;margin-top:30px}
  .h + .h{margin-top:16px;width:62%}
  .by{flex:none;display:flex;align-items:center;gap:12px;margin-top:26px}
  .by i{display:block;height:10px;border-radius:5px;background:#55555f;width:26%}
  .by i:first-child{width:30px;height:30px;border-radius:50%;background:#E5322B}
  .p{flex:none;height:12px;border-radius:6px;background:#3a3a43;margin-top:20px}
  .p.gap{margin-top:36px}
  .bar{flex:none;margin-top:auto;display:flex;align-items:center;gap:12px}
  .bar b{display:flex;align-items:center;justify-content:center;gap:5px;flex:none;width:52px;height:52px;border-radius:26px;background:#26262d}
  .bar b.url{flex:1;gap:10px}
  .bar .dot{width:6px;height:6px;border-radius:50%;background:#a3a3ad}
  .bar .lock{width:11px;height:11px;border-radius:3px;background:#a3a3ad}
  .bar .host{width:46%;height:10px;border-radius:5px;background:#a3a3ad}
</style></head><body>
<!-- The In-App Event art for 1.0.5, "The Stay-Put Update": a web page stands still in a current that carries
     every arrow off to the upper right, the way an outbound link points. The current is a real potential flow
     solved around the page's own outline, so the bands part and pinch where water would.
     No text, no logo, no border and no scrim (docs/research/in-app-event-art.md); the key subject sits above
     the band Apple's text covers. The window's shape picks the layout, at any multiple of the minimum size:
       chrome-headless-shell --headless --hide-scrollbars --force-device-scale-factor=1 \
         --window-size=1920,1080 --screenshot=card.png "file://$PWD/art.html"
       ... --window-size=1080,1920 --screenshot=details.png "file://$PWD/art.html" -->
<canvas id="flow"></canvas><svg id="arrows" xmlns="http://www.w3.org/2000/svg"></svg><div id="stage"></div>
<script>
const W = innerWidth, H = innerHeight, tall = H > W, u = Math.min(W, H) / 1080, Wu = W / u, Hu = H / u;
// Every length below is in units of a 1080-wide (tall) or 1080-high (wide) frame.
// arrows: [stream (in bands from the line that splits on the page), where the tip is along the stream, length, width]
const F = tall
  ? { cx: 540, cy: 705, pw: 520, ph: 850, deg: 62, band: 64, hero: 290, lines: 8,
      arrows: [[-1.5, 610, 880, 24], [2.5, 700, 620, 30], [4.5, 240, 470, 22]] }
  : { cx: 960, cy: 390, pw: 450, ph: 498, deg: 24, band: 60, hero: 144, lines: 2,
      arrows: [[-1.5, 640, 1040, 24], [-5.5, -300, 600, 30], [1.5, 880, 640, 30], [4.5, 780, 520, 22]] };
const R = 46, th = F.deg * Math.PI / 180, dx = Math.cos(th), dy = -Math.sin(th);

// 1. The current: Laplace's equation for the stream function, zero on the page, a uniform stream far away.
const g = 5, P = 560, nx = Math.ceil((Wu + 2 * P) / g) + 1, ny = Math.ceil((Hu + 2 * P) / g) + 1;
const psi = new Float64Array(nx * ny), solid = new Uint8Array(nx * ny);
const far = (x, y) => dx * (y - F.cy) - dy * (x - F.cx);
const inPage = (x, y) => {
  const qx = Math.abs(x - F.cx) - (F.pw / 2 - R), qy = Math.abs(y - F.cy) - (F.ph / 2 - R);
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) <= R;
};
for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
  const x = i * g - P, y = j * g - P, k = j * nx + i;
  if (inPage(x, y)) solid[k] = 1; else psi[k] = far(x, y);
}
const om = 2 / (1 + Math.sin(Math.PI / Math.max(nx, ny)));
for (let it = 0; it < 1100; it++)
  for (let j = 1; j < ny - 1; j++) for (let k = j * nx + 1, e = k + nx - 2; k < e; k++)
    if (!solid[k]) psi[k] += om * ((psi[k - 1] + psi[k + 1] + psi[k - nx] + psi[k + nx]) / 4 - psi[k]);
const S = (x, y) => {
  const fx = (x + P) / g, fy = (y + P) / g, i = Math.floor(fx), j = Math.floor(fy);
  if (i < 0 || j < 0 || i >= nx - 1 || j >= ny - 1) return far(x, y);
  const a = fx - i, b = fy - j, k = j * nx + i;
  return (psi[k] * (1 - a) + psi[k + 1] * a) * (1 - b) + (psi[k + nx] * (1 - a) + psi[k + nx + 1] * a) * b;
};

// 2. The bands between stream lines, flat tints of the brand red; the line that meets the page is a band edge, so the split shows.
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const TONES = ["#CD112A", "#D9152B", "#E3192B", "#EA2630", "#F13536", "#F7433B"].map(rgb);
const SEQ = [1, 3, 2, 0, 2, 4, 1, 3, 2, 5, 2, 0, 3, 1, 4, 2, 3];
const tone = (i) => TONES[SEQ[((i % SEQ.length) + SEQ.length) % SEQ.length]];
const cv = document.getElementById("flow"); cv.width = W; cv.height = H;
const ctx = cv.getContext("2d"), img = ctx.createImageData(W, H), sv = new Float32Array(W * H);
for (let y = 0, k = 0; y < H; y++) for (let x = 0; x < W; x++, k++) sv[k] = S((x + 0.5) / u, (y + 0.5) / u) / F.band;
for (let y = 0, k = 0; y < H; y++) for (let x = 0; x < W; x++, k++) {
  const s = sv[k], gx = (sv[x < W - 1 ? k + 1 : k] - sv[x ? k - 1 : k]) / (x && x < W - 1 ? 2 : 1),
    gy = (sv[y < H - 1 ? k + W : k] - sv[y ? k - W : k]) / (y && y < H - 1 ? 2 : 1);
  const i = Math.floor(s), f = s - i - 0.5, edge = (0.5 - Math.abs(f)) / (Math.hypot(gx, gy) || 1e-6);
  const a = tone(i), b = tone(f > 0 ? i + 1 : i - 1), t = Math.max(0, 0.5 - edge);
  img.data[k * 4] = a[0] + (b[0] - a[0]) * t; img.data[k * 4 + 1] = a[1] + (b[1] - a[1]) * t;
  img.data[k * 4 + 2] = a[2] + (b[2] - a[2]) * t; img.data[k * 4 + 3] = 255;
}
ctx.putImageData(img, 0, 0);

// 3. The arrows ride stream lines: each is one closed outline, a tapering tail into a head about as wide for its
//    stroke as the app icon's (2.1 strokes drawn, 2.16 in docs/app-icon.md).
const step = 4, reach = 1900;
const trace = (bands) => {
  let x = F.cx - dx * reach - dy * bands * F.band, y = F.cy - dy * reach + dx * bands * F.band;
  const vel = (x, y) => {
    const a = S(x, y + g) - S(x, y - g), b = S(x - g, y) - S(x + g, y), m = Math.hypot(a, b) || 1;
    return [a / m, b / m];
  };
  const pts = [];
  for (let n = 0; n < (2 * reach) / step; n++) {
    pts.push([x, y]);
    const [ax, ay] = vel(x, y), [bx, by] = vel(x + ax * step / 2, y + ay * step / 2);
    x += bx * step; y += by * step;
  }
  return pts;
};
const outline = ([bands, tip, len, w]) => {
  const pts = trace(bands), end = Math.round((reach + tip) / step), head = Math.round((w * 1.9) / step),
    start = end - Math.round(len / step), neck = end - head, L = [], Rr = [];
  const frame = (n) => {
    const [x, y] = pts[n], [x2, y2] = pts[n + 1], m = Math.hypot(x2 - x, y2 - y);
    return [x, y, (x2 - x) / m, (y2 - y) / m];
  };
  for (let n = start; n <= neck; n++) {
    const [x, y, tx, ty] = frame(n), q = (n - start) / (neck - start);
    const k = Math.min(1, q / 0.6), hw = (w / 2) * (0.04 + 0.96 * k * k * (3 - 2 * k));
    L.push([x - ty * hw, y + tx * hw]); Rr.push([x + ty * hw, y - tx * hw]);
  }
  const [x, y] = pts[neck], [ex, ey] = pts[end], m = Math.hypot(ex - x, ey - y) || 1, tx = (ex - x) / m, ty = (ey - y) / m, wing = w * 1.16;
  const tipPts = [[x - ty * wing, y + tx * wing], [ex, ey], [x + ty * wing, y - tx * wing]];
  return [...L, ...tipPts, ...Rr.reverse()].map(([a, b], n) => `${n ? "L" : "M"}${a.toFixed(1)} ${b.toFixed(1)}`).join("") + "Z";
};
const svg = document.getElementById("arrows");
svg.setAttribute("viewBox", `0 0 ${Wu} ${Hu}`);
svg.innerHTML = `<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#6E0016" flood-opacity=".38"/></filter></defs>
  <g fill="#FFF4EF" stroke="#FFF4EF" stroke-linejoin="round" filter="url(#lift)">${F.arrows.map((a) => `<path d="${outline(a)}" stroke-width="${(a[3] * 0.18).toFixed(1)}"/>`).join("")}</g>`;

// 4. The page: an article in Safari, dark like the rest of the listing, upright and whole.
// Its picture is a sun on a still horizon, drawn from the horizon line so it keeps its shape in either frame.
const sunrise = (w, h, k = h / 200) => `<svg viewBox="${-w / 2} ${-0.62 * h} ${w} ${h}">
  <circle cx="${0.13 * w}" r="${58 * k}" fill="#f4f4f6"/>
  <path d="M${-w / 2 - 20} 0q${0.2 * w} ${-44 * k} ${0.4 * w} ${-16 * k}t${0.34 * w} ${16 * k}z" fill="#3d3d47"/><path d="M${-w} 0h${2 * w}v${h}h${-2 * w}z" fill="#1c1c21"/>
  ${[[100, 14, 1], [64, 32, 0.7], [32, 50, 0.4]].map(([bw, y, o]) => `<rect x="${0.13 * w - (bw * k) / 2}" y="${y * k}" width="${bw * k}" height="${8 * k}" rx="${4 * k}" fill="#f4f4f6" opacity="${o}"/>`).join("")}</svg>`;
const stage = document.getElementById("stage");
stage.style.cssText = `width:${Wu}px;height:${Hu}px;transform:scale(${u})`;
stage.innerHTML = `<div class="page" style="left:${F.cx - F.pw / 2}px;top:${F.cy - F.ph / 2}px;width:${F.pw}px;height:${F.ph}px">
  <div class="hero" style="height:${F.hero}px">${sunrise(F.pw - 52, F.hero)}</div>
  <div class="h"></div><div class="h"></div>
  <div class="by"><i></i><i></i></div>
  ${Array.from({ length: F.lines }, (_, n) => `<div class="p${n ? "" : " gap"}" style="width:${[100, 94, 100, 71, 100, 90, 100, 97, 58][n]}%"></div>`).join("")}
  <div class="bar"><b><svg width="14" height="22" viewBox="0 0 14 22"><path d="M11 3 3 11l8 8" fill="none" stroke="#f4f4f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></b>
    <b class="url"><i class="lock"></i><i class="host"></i></b><b><i class="dot"></i><i class="dot"></i><i class="dot"></i></b></div>
</div>`;
</script></body></html>
