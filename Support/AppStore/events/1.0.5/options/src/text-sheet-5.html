<!doctype html>
<html><head><meta charset="utf-8">
<!-- Fourth text sheet for the 1.0.5 event: the name kept, four pairs that sell the result to the buyer
     (what they were doing, and that they get to finish it) and name no tool. Each pair is a stage 1 text
     (true of the release on the store) and a stage 2 text (stage 1 plus one beat, true once 1.1.0 is live).
     Same art and Apple overlay as the earlier sheets; the pairs and their sources are in
     docs/research/in-app-event-art.md, "Event text, fourth pass".
       bun render.mjs src/text-sheet-5.html text-sheet-5.png 2180 900 page 2   (run in options/) -->
<style>
  :root { --font: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; }
  html, body { margin: 0; background: #f2f2f4; font-family: var(--font); color: #1d1d1f; -webkit-font-smoothing: antialiased; }
  body { width: 2180px; padding: 34px 44px 44px; box-sizing: border-box; }
  h1 { font: 700 22px/1.2 var(--font); margin: 0 0 4px; }
  .sub { font: 400 13px/1.45 var(--font); color: #6e6e73; margin: 0 0 26px; max-width: 1180px; }
  .row { display: grid; grid-template-columns: repeat(5, 385px); justify-content: space-between; }
  .opt h2 { font: 700 17px/1.2 var(--font); margin: 0 0 3px; }
  .opt h2 em { font: 700 10px/1 var(--font); font-style: normal; letter-spacing: .05em; text-transform: uppercase; color: #fff; background: #0071e3; border-radius: 4px; padding: 3px 6px; margin-left: 8px; vertical-align: 2px; }
  .opt .what { font: 400 12.5px/1.4 var(--font); color: #6e6e73; margin: 0 0 14px; min-height: 53px; }
  .opt .det { margin: 0 auto; }
  .lab { font: 600 10px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; color: #8e8e93; margin: 18px 0 8px; }
  .now { font: 700 11px/16px var(--font); color: #0071e3; text-transform: uppercase; letter-spacing: .02em; margin-bottom: 4px; }
  .counts { margin: 16px 0 0; padding: 0; list-style: none; font: 400 12px/1.45 var(--font); color: #1d1d1f; }
  .counts li { display: grid; grid-template-columns: 44px 1fr 46px; gap: 8px; padding: 5px 0; border-top: 1px solid #d2d2d7; }
  .counts li:last-child { border-bottom: 1px solid #d2d2d7; }
  .counts span { color: #8e8e93; font-weight: 600; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; padding-top: 2px; }
  .counts b { font-weight: 400; color: #6e6e73; text-align: right; font-variant-numeric: tabular-nums; }

  /* Apple's event card: 16:9, text over the artwork */
  .card { position: relative; width: 385px; height: 216.5px; border-radius: 17px; overflow: hidden; display: grid; grid-template-areas: "content"; box-shadow: 0 1px 2px rgb(0 0 0 / 8%), 0 8px 24px rgb(0 0 0 / 10%); }
  .card > img, .det > img { grid-area: content; width: 100%; height: 100%; object-fit: cover; display: block; }
  .gradient-container { grid-area: content; position: relative; z-index: 1; }
  .gradient-overlay { -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    background: linear-gradient(#0000, var(--color) var(--height, 100%)); bottom: 0; filter: saturate(1.5) brightness(var(--brightness));
    height: var(--height, 60%); -webkit-mask-image: linear-gradient(180deg, #0000 6%, #000001 85%); mask-image: linear-gradient(180deg, #0000 6%, #000001 85%);
    position: absolute; width: 100%; z-index: 1; }
  .card .gradient-overlay { --color: rgb(83 83 83 / 48%); --height: 80%; --brightness: .85; border-radius: 17px; }
  .card .text-container { color: #ffffffeb; display: flex; flex-direction: column; grid-area: content; justify-content: flex-end; padding: 12px 16px; z-index: 2; }
  .card .kind { font: 600 12px/1.25 var(--font); text-transform: uppercase; opacity: .92; }
  .card h3 { font: 400 17px/1.41 var(--font); margin: 0; }
  .card p { font: 600 12px/1.25 var(--font); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Apple's event details page: 9:16 */
  .det { position: relative; width: 340px; height: 604.4px; border-radius: 16px; overflow: hidden; display: grid; grid-template-areas: "time" "text"; grid-template-rows: 1fr auto; box-shadow: 0 1px 2px rgb(0 0 0 / 8%), 0 8px 24px rgb(0 0 0 / 10%); }
  .det > img { grid-column: 1; grid-row: 1 / 3; position: absolute; inset: 0; }
  .det .gradient-overlay { --height: 70%; --brightness: .85; border-radius: 16px; }
  .det .time { grid-area: time; margin: 16px 0 0 16px; z-index: 3; }
  .det .time span { background: #ffffffa3; border-radius: 12px; color: #000000d9; font: 600 12px/1.25 var(--font); padding: 3px 10px; }
  .det .text-container { color: #ffffffeb; display: flex; flex-direction: column; gap: 16px; grid-area: text; justify-content: space-between; padding: 16px; z-index: 2; }
  .det .event-details-container { display: flex; flex-direction: column; gap: 6px; }
  .det .kind { font: 600 12px/1.25 var(--font); text-transform: uppercase; }
  .det .title { font: 700 26px/1.23 var(--font); margin: 0; }
  .det .subtitle { font: 400 15px/1.33 var(--font); margin: 0; }
  .det .lockup { border-top: 1px solid #ffffff4d; padding-top: 16px; display: flex; align-items: center; gap: 10px; }
  .det .lockup img { width: 40px; height: 40px; border-radius: 9px; flex: none; }
  .det .lockup > span:not(.view) { min-width: 0; }
  .det .lockup b { font: 600 13px/1.2 var(--font); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .det .lockup i { font: 400 11px/1.3 var(--font); font-style: normal; opacity: .75; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .det .lockup .view { margin-left: auto; font: 700 13px/1 var(--font); background: #ffffff38; border-radius: 14px; padding: 7px 16px; flex: none; }
  .band { margin: 0 0 20px; padding: 0 0 8px; border-bottom: 2px solid #1d1d1f; display: flex; align-items: baseline; gap: 14px; }
  .band + .row { margin-bottom: 46px; }
  .band h2 { font: 700 19px/1.2 var(--font); margin: 0; }
  .band p { font: 400 13px/1.4 var(--font); color: #6e6e73; margin: 0; }
  .band.later h2 { color: #b3261e; } .band.later { border-color: #b3261e; }
  .opt.note { align-self: start; background: #fff; border-radius: 14px; padding: 18px 20px; box-sizing: border-box; font: 400 13px/1.5 var(--font); color: #1d1d1f; }
  .opt.note h2 { margin-bottom: 8px; } .opt.note p { margin: 0 0 10px; } .opt.note p:last-child { margin: 0; }
  .counts mark { background: #ffe08a; color: inherit; border-radius: 3px; padding: 0 2px; }
  .same { font: 400 11.5px/1.4 var(--font); color: #8e8e93; margin: 8px 0 0; }
</style></head><body>
<h1>Undirect In-App Event: descriptions in the competitors’ shape</h1>
<p class="sub">The name stays “The Stay-Put Update”. Each option is written in the shape of a top competitor’s store line and states the result. Stage 1 goes up now; stage 2 adds what 1.1.0 shows on the page. Apple’s limits are 50 and 120 characters.</p>
<div id="sheet"></div>
<script>
const KIND = "Major Update", NAME = "The Stay-Put Update";
const BG = "#ce0420";   // the Paperweight details image's own lower third, as in contact.html
const ROWS = [
 {
  "title": "Stage 1: true of 1.0.5, on the store now",
  "sub": "Written in the shape the top competitors use on their store pages.",
  "sets": [
   {
    "tag": "What competitors say",
    "note": [
     "AdGuard: “No annoyances, No trackers, No ads” and “Take back your privacy and security”.",
     "Total Adblock: “Faster Browsing With No Ads”. Wipr 2: “Block all the bad things”.",
     "1Blocker: “Remove ads on sites. Stick with Safari.” Banish: “Block annoying ‘Open in App’ popups”.",
     "Short, blunt, plain words; the bad thing named and gone, or the good result stated. None of them has an In-App Event running."
    ]
   },
   {
    "tag": "Before",
    "what": "The text in event.json today.",
    "short": "Pages can no longer send you away with no tap",
    "long": "Undirect now keeps you on the page when a site redirects as it loads or while you scroll, and Back takes you back."
   },
   {
    "tag": "X. No, no (AdGuard's shape)",
    "what": "The two things buyers complain about, named and gone.",
    "short": "No surprise redirects. No broken Back button.",
    "long": "Sites keep inventing ways to throw you to scam pages. Undirect closes them. You stay on the page you chose.",
    "pick": true
   },
   {
    "tag": "Y. Already blocked (Wipr's shape)",
    "what": "Whatever new trick pages come up with, it is already handled.",
    "short": "New redirect tricks? Already blocked.",
    "long": "Pages now redirect you as you scroll and hijack your Back button. Not anymore: you stay right where you tapped."
   },
   {
    "tag": "Z. The result (1Blocker's shape)",
    "what": "Only the outcome on the card; the ways a site tries are on the details page.",
    "short": "Stay on the page you opened. Every time.",
    "long": "However a site tries to throw you to a scam page, as it loads, mid-scroll or through the Back button, you stay put."
   }
  ]
 },
 {
  "title": "Stage 2: once 1.1.0 is live, you see it happen",
  "sub": "The same message with the effects added.",
  "later": true,
  "sets": [
   {
    "tag": "How it switches",
    "note": [
     "Stage 1 goes up now. Stage 2 replaces it the day 1.1.0 is on the store, through a short second event review."
    ]
   },
   {
    "tag": "X, stage 2",
    "what": "",
    "short": "No surprise redirects. No broken Back button.",
    "long": "Sites keep inventing ways to throw you to scam pages. Undirect shuts each one, right before your eyes.",
    "markS": "No surprise redirects. No broken Back button.",
    "markL": "Sites keep inventing ways to throw you to scam pages. Undirect shuts each one{, right before your eyes}.",
    "sameCard": true
   },
   {
    "tag": "Y, stage 2",
    "what": "",
    "short": "New redirect tricks? Blocked as you watch.",
    "long": "Pages now redirect you as you scroll and hijack your Back button. Not anymore, and now you watch them fail.",
    "markS": "New redirect tricks? Blocked{ as you watch}.",
    "markL": "Pages now redirect you as you scroll and hijack your Back button. Not anymore{, and now you watch them fail}.",
    "sameCard": false
   },
   {
    "tag": "Z, stage 2",
    "what": "",
    "short": "Stay on the page you opened. See every try fail.",
    "long": "Whether a site redirects as it loads, mid-scroll or through the Back button, you stay put and watch it fail.",
    "markS": "Stay on the page you opened.{ See every try fail.}",
    "markL": "Whether a site redirects as it loads, mid-scroll or through the Back button, you stay put{ and watch it fail}.",
    "sameCard": false
   }
  ]
 }
];
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const card = (e) => `<div class="card"><img src="../../card.png"><div class="gradient-container"><div class="gradient-overlay"></div></div>
  <div class="text-container"><span class="kind">${KIND}</span><h3>${NAME}</h3><p>${esc(e.short)}</p></div></div>`;
const det = (e) => `<div class="det"><img src="../../details.png"><div class="gradient-overlay" style="--color:${BG}"></div>
  <div class="time"><span>Happening Now</span></div>
  <div class="text-container"><div class="event-details-container"><span class="kind">${KIND}</span><h2 class="title">${NAME}</h2><p class="subtitle">${esc(e.long)}</p></div>
  <div class="lockup"><img src="../../../../../../web/undirect-app-icon.png"><span><b>Undirect - Tab &amp; Popup Blocker</b><i>Stop Safari redirects, ad tabs</i></span><span class="view">View</span></div></div></div>`;
const mark = (m, plain) => m ? esc(m).replace("{", "<mark>").replace("}", "</mark>") : esc(plain);
const cell = (e) => e.note ? `<div class="opt note"><h2>${esc(e.tag)}</h2>${e.note.map((p) => `<p>${p}</p>`).join("")}</div>`
  : `<div class="opt"><h2>${esc(e.tag)}${e.pick ? "<em>Pick</em>" : ""}</h2><p class="what">${e.what || "Stage 1 plus the marked beat."}</p>
  <div class="now">Happening now</div>${card(e)}
  <div class="lab">Event details page</div>${det(e)}
  <ul class="counts"><li><span>Short</span><div>${mark(e.markS, e.short)}</div><b>${e.short.length}/50</b></li><li><span>Long</span><div>${mark(e.markL, e.long)}</div><b>${e.long.length}/120</b></li></ul>${e.sameCard ? '<p class="same">The card line stays the same as stage 1.</p>' : ""}</div>`;
document.getElementById("sheet").innerHTML = ROWS.map((r) => `<div class="band${r.later ? " later" : ""}"><h2>${esc(r.title)}</h2><p>${r.sub}</p></div><div class="row">${r.sets.map(cell).join("")}</div>`).join("");
const all = ROWS.flatMap((r) => r.sets).filter((e) => !e.note);
const over = all.filter((e) => e.short.length > 50 || e.long.length > 120).map((e) => e.tag);
const clipped = [...document.querySelectorAll(".card p")].filter((p) => p.scrollWidth > p.clientWidth).length;
if (over.length) window.__error = "ERR over Apple's limit: " + over.join(", ");
Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => { window.__note = `text sheet 4, ${all.length} sets, ${clipped} short descriptions clipped`; window.__done = true; });
</script>
</body></html>
