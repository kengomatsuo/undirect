<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>a silent background</title>
<script src="site.js"></script>
<script src="navigation.js"></script>
<script src="shim.js"></script>
<script src="recipes.js"></script>
<script src="fx.js"></script><script src="guard.test.js"></script>
<script>
// shim.js reads mode and hang from this page's own query string.
if (!location.search.includes("hang=1")) location.replace("?mode=watched&hang=1");
// The site is not guarded and the background never says so. A redirect in the
// first script is held while the guard waits, and has to be let go: this page
// passes by arriving on landed.html?from=hang within a few seconds.
else location.href = "http://localhost:8767/landed.html?from=hang";
</script>
</head>
<body><pre id="out">FAIL: still here, the redirect was held for good</pre></body></html>
